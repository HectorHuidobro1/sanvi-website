# Configuracion de despliegue de Sanvi en Netlify.
# El sitio es estatico: no hay comando de build, solo publicacion de la carpeta
# sitio-sanvi/. Netlify solo lee netlify.toml desde la raiz del repositorio,
# por eso este archivo vive aqui y no dentro de sitio-sanvi/.
[build]
  base = "sitio-sanvi"
  # Cuando se define `base`, Netlify resuelve `publish` relativo a esa carpeta,
  # no a la raiz del repo. "sitio-sanvi" aqui apuntaba a "sitio-sanvi/sitio-sanvi"
  # (no existe) y el deploy fallaba. "." significa "la propia carpeta base".
  publish = "."

# Las URLs del sitio son .html reales. Desactivar pretty_urls evita que Netlify
# redirija /servicios.html a /servicios y rompa los canonicals y el sitemap.
[build.processing.html]
  pretty_urls = false

# El subdominio por defecto de Netlify (*.netlify.app) sirve una copia completa
# e indexable del sitio si no se redirige explicitamente. Forzamos un 301 hacia
# el dominio real preservando la ruta, para evitar contenido duplicado a nivel
# de host durante la ventana critica de indexacion inicial.
[[redirects]]
  from = "https://transcendent-elf-3f4e94.netlify.app/*"
  to = "https://sanvi.cl/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'self' https://wa.me; frame-ancestors 'none'; base-uri 'self'"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=600, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=600, must-revalidate"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
